<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Disciplinary Action Tracker</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#1b2230;--mut:#667085;--bd:#d8dde6;--ac:#1f5fbf;--acx:#fff;--bad:#b42318;--ok:#13734a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#12161d;--card:#1b212b;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#2d3542;--ac:#6ea2f5;--acx:#0d1320;--bad:#f97066;--ok:#4cc38a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161d;--card:#1b212b;--tx:#e8ebf1;--mut:#9aa3b2;--bd:#2d3542;--ac:#6ea2f5;--acx:#0d1320;--bad:#f97066;--ok:#4cc38a}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--card);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}h2{font-size:16px;margin:0 0 10px}
main{max-width:1000px;margin:0 auto;padding:16px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--mut)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.full{grid-column:1/-1}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:3px}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:80px}
button.b{background:var(--ac);color:var(--acx);border:0;border-radius:6px;padding:8px 14px;cursor:pointer;font:inherit}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:10px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mut);font-weight:600;white-space:nowrap}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--bd)}
.bad{color:var(--bad);border-color:var(--bad)}.ok{color:var(--ok);border-color:var(--ok)}
.mut{color:var(--mut);font-size:13px}.pre{white-space:pre-wrap}
code{background:var(--bg);padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12px;border:1px solid var(--bd)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:8px;display:none;z-index:50}
#docwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow:auto;z-index:20;padding:12px}
#docbar{max-width:800px;margin:0 auto 8px;display:flex;gap:8px;justify-content:flex-end;padding-top:env(safe-area-inset-top,0px)}
#doc{max-width:800px;margin:0 auto;background:#fff;color:#000;padding:26px 36px;font:14px/1.4 "Times New Roman",serif}#doc p{margin:5px 0}
#doc h3{text-align:center;margin:0 0 4px;font-size:18px;text-transform:uppercase}
#doc .sub{text-align:center;margin-bottom:10px}#doc table{margin:10px 0}#doc td,#doc th{border:1px solid #000;color:#000;font-size:14px;padding:6px;text-align:left;vertical-align:top}#doc th{width:38%;background:#eee}
#doc .sig{display:flex;gap:30px;margin-top:36px}#doc .sig div{flex:1;border-top:1px solid #000;padding-top:4px;font-size:13px}
#doc .sgs{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;font-size:12px}#doc .g4{grid-template-columns:repeat(2,1fr)}#doc .g4>div{margin-bottom:4px}#doc .sgs>div{padding:0 14px;text-align:center}#doc .sgs .rl{font-weight:bold;margin-bottom:22px}#doc .sgs .sl{border-top:1px solid #000}#doc .sgs .pt{margin-top:5px;display:flex;align-items:flex-end;gap:6px;white-space:nowrap}#doc .sgs .pl{flex:1;border-bottom:1px solid #000;height:12px}
@page{margin:12mm}@media print{body>*:not(#docwrap){display:none!important}#docwrap{position:static;background:none;padding:0;overflow:visible}#docbar{display:none}#doc{padding:0;max-width:none}}
</style></head><body>
<header><div><h1>Disciplinary Action Tracker</h1><div class="mut" id="hdc" style="font-size:12px"></div></div>
<div class="bar" id="who"></div></header>
<main><nav id="nav"></nav><div id="view"></div>
<p class="mut" style="margin-top:20px;border-top:1px solid var(--bd);padding-top:10px;">May Harvest Corporation &middot; Disciplinary Action Management System &middot; Cloud Synchronized (Cloudflare &amp; Supabase). Letter templates follow the Philippine two-notice rule (notice to explain, then notice of decision).</p></main>
<div id="docwrap"><div id="docbar"><button class="b" data-act="print">Print</button><button class="s" style="background:var(--card)" data-act="savedoc">Save as HTML</button><button class="s" style="background:var(--card)" data-act="close">Close</button></div><div id="doc"></div></div>
<div id="login" style="position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:20px"><div class="card" id="lg" style="max-width:440px;margin:6vh auto;box-shadow:0 8px 30px rgba(0,0,0,0.12)"></div></div>
<div id="edwrap" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow:auto;z-index:30;padding:12px"><div class="card" id="ed" style="max-width:760px;margin:20px auto"></div></div>
<div id="pwwrap" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;overflow:auto;z-index:35;padding:12px"><div class="card" id="pwcard" style="max-width:420px;margin:12vh auto;box-shadow:0 8px 30px rgba(0,0,0,0.2)"></div></div>
<div id="toast"></div>
<script>
const MAP={MHC:"May Harvest Corporation",Workbridge:"Workbridge Corporation",Multi:"Multicareer Manpower Services","Top Jinzai":"Top Jinzai Company, Inc.",BLGM:"BLGM Manpower Services",Omnichron:"Omnichron Security Agency, Inc"};
const AG=Object.values(MAP);
const DEPTS=["Basic","Further","Blast","CCM","Warehouse","BLGM","E&M","Quality","Scaler","Dry warehouse","PFRP","24 Chicken","Utility","Canteen","Admin"];
const ACC=[{id:"adminhead",name:"Admin Head",role:"admin"},{id:"hr1",name:"HR Officer 1 - Aliyah Francine Gojo Cruz",role:"admin"},{id:"hr2",name:"HR Officer 2 - Aira Jheanne Rufino, RPm",role:"admin"},{id:"prod",name:"Production Head - Geraldine Mendoza",role:"head"},{id:"wh",name:"Warehouse Head - Lilibeth Menoza",role:"head"},{id:"qa",name:"Quality Head - Jerwin Mendoza",role:"head"},{id:"eng",name:"Engineering Head - Adonis Palad",role:"head"},{id:"ops",name:"Operations Manager",role:"head"},{id:"dco",name:"Document Control Officer",role:"dco"},{id:"wb",name:"Workbridge Corporation",role:"agency",agency:"Workbridge"},{id:"multi",name:"Multicareer Manpower Services",role:"agency",agency:"Multi"},{id:"tj",name:"Top Jinzai Company, Inc.",role:"agency",agency:"Top Jinzai"},{id:"blgm",name:"BLGM Manpower Services",role:"agency",agency:"BLGM"},{id:"omni",name:"Omnichron Security Agency, Inc",role:"agency",agency:"Omnichron"}];
ACC.forEach(a=>{if(a.agency){a.agency=MAP[a.agency]||a.agency;a.name=a.agency}});
const PERM={admin:["A","B","C","D","G","E","H"],agency:["A","B","D","G"],head:["A","D","G"],dco:["H"]};
const DEFAULT_DAT_PASSWORDS={
  adminhead: "MHC_Admin2026+",
  hr1: "Aliyah2026+",
  hr2: "2026+Aira",
  ops: "MHC_Ops2026+",
  dco: "MHC_Doc2026+",
  prod: "Gigi+2026",
  wh: "+2026Beth",
  qa: "Jerwin+2026",
  eng: "2026+Ado",
  wb: "rommel26+",
  multi: "Giselle+2026",
  tj: "2026+Nin",
  blgm: "MHC_Agency2026+",
  omni: "MHC_Agency2026+"
};
const LEGACY_DAT_PASSWORDS={adminhead:"admin123",hr1:"hr123",hr2:"hr123",ops:"ops123",dco:"doc123",prod:"prod123",wh:"wh123",qa:"qa123",eng:"eng123",wb:"wb123",multi:"multi123",tj:"tj123",blgm:"blgm123",omni:"omni123"};
let user=null,AC={},lgId="adminhead",lgMsg="";
try{AC=JSON.parse(localStorage.getItem("dat_ac")||"{}")}catch(e){}
function saveAc(){try{localStorage.setItem("dat_ac",JSON.stringify(AC))}catch(e){}if(window.MhcCloudSync&&typeof window.MhcCloudSync.forceSync==="function"){window.MhcCloudSync.forceSync();}else if(window.MhcCloudSync&&typeof window.MhcCloudSync.push==="function"){window.MhcCloudSync.push();}}
async function hp(id,pw){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("dat:"+id+":"+pw));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent("dat:"+id+":"+pw)))}}

function pickAccount(uid){
  lgId=uid;
  try{localStorage.setItem("dat_last_u",uid);}catch(e){}
  if($("#lgid"))$("#lgid").value=uid;
  const a=ACC.find(x=>x.id===uid);
  if($("#sel_name")&&a)$("#sel_name").textContent=a.name;
  document.querySelectorAll(".role-btn").forEach(btn=>{
    btn.style.background="var(--card)";
    btn.style.color="var(--tx)";
    btn.style.borderColor="var(--bd)";
    btn.style.fontWeight="normal";
  });
  const activeBtn=$("#btn_"+uid);
  if(activeBtn){
    activeBtn.style.background="var(--ac)";
    activeBtn.style.color="var(--acx)";
    activeBtn.style.borderColor="var(--ac)";
    activeBtn.style.fontWeight="600";
  }
  if($("#lg_pw")){
    $("#lg_pw").value="";
    $("#lg_pw").focus();
  }
  if($("#lgmsg"))$("#lgmsg").textContent="";
}

function showLogin(){
  $("#login").style.display="block";
  let lastU="adminhead";
  try{
    lastU=localStorage.getItem("dat_last_u")||"adminhead";
  }catch(e){}
  if(!ACC.some(x=>x.id===lastU))lastU="adminhead";
  lgId=lastU;

  $("#lg").innerHTML=`
    <div style="text-align:center;margin-bottom:14px">
      <h2 style="margin:0 0 4px">Disciplinary Action Tracker</h2>
      <div class="mut" style="font-size:12px">May Harvest Corporation &middot; I-click ang inyong username at i-type ang password</div>
    </div>
    <form data-f="LG">
      <label style="font-weight:600;margin-bottom:6px">Piliin ang inyong Username / Role:</label>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;max-height:190px;overflow-y:auto;padding:2px 2px 6px;margin-bottom:12px;border-bottom:1px solid var(--bd)">
        ${ACC.map(a=>`
          <button type="button" class="s role-btn" onclick="pickAccount('${a.id}'); return false;" id="btn_${a.id}" style="padding:8px 4px;font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;${a.id===lgId?'background:var(--ac);color:var(--acx);font-weight:600;border-color:var(--ac)':''}">
            ${esc(a.name)}
          </button>
        `).join("")}
      </div>

      <input type="hidden" name="id" id="lgid" value="${esc(lgId)}">
      <div style="margin:8px 0 12px;font-size:13px;color:var(--tx)">
        Napiling Account: <b id="sel_name" style="color:var(--ac)">${esc((ACC.find(x=>x.id===lgId)||{}).name || "Admin Head")}</b>
      </div>

      <label style="font-weight:600;margin-top:10px">Password</label>
      <input type="password" id="lg_pw" name="pw" required autocomplete="current-password" value="" placeholder="I-type ang inyong password dito" style="margin-top:4px">

      <div class="row" style="margin-top:16px">
        <span class="mut" style="color:var(--bad);font-size:12px" id="lgmsg">${esc(lgMsg)}</span>
        <button class="b" style="width:100%">Log in</button>
      </div>
    </form>
  `;
  setTimeout(()=>{if($("#lg_pw"))$("#lg_pw").focus()},80);
}

async function doLogin(o){
  const a=ACC.find(x=>x.id===o.id);
  if(!a) return;
  lgId=a.id;
  const pw=(o.pw||"").trim();
  if(!pw){
    lgMsg="Pakilagay ang inyong password.";
    return showLogin();
  }
  
  const enteredHash=await hp(a.id,pw);
  const defP=DEFAULT_DAT_PASSWORDS[a.id];
  const legP=LEGACY_DAT_PASSWORDS[a.id];
  const savedHash=AC[a.id];
  
  const isMatch=(savedHash&&savedHash===enteredHash)||
                (!savedHash&&(pw===defP||pw===legP))||
                (pw===defP||pw===legP);
                
  if(!isMatch){
    lgMsg="Maling password. Pakisubukang muli.";
    return showLogin();
  }
  
  user=a;
  role=a.role;
  ag=a.agency||AG[0];
  lgMsg="";
  
  try{
    localStorage.setItem("dat_last_u",a.id);
    sessionStorage.setItem("dat_user",JSON.stringify(a));
  }catch(e){}
  
  $("#login").style.display="none";
  updateWho();
  render();
}

function updateWho(){
  if(!user){$("#who").innerHTML="";return;}
  $("#who").innerHTML=`<b>${esc(user.name)}</b> <span class="tag" style="margin:0 4px">${esc(user.role.toUpperCase())}</span> <button class="s" type="button" onclick="manualSyncRefresh()" title="Sync and refresh data from cloud">🔄 Sync Now</button> <button class="s" data-act="changepw">🔑 Change Password</button> <button class="s" data-act="logout">Log out</button>`;
}

function logout(){
  user=null;
  role="admin";
  try{sessionStorage.removeItem("dat_user")}catch(e){}
  $("#view").innerHTML="";
  $("#nav").innerHTML="";
  $("#who").innerHTML="";
  $("#edwrap").style.display="none";
  $("#docwrap").style.display="none";
  $("#pwwrap").style.display="none";
  showLogin();
}

function showPwModal(){
  if(!user) return;
  $("#pwwrap").style.display="block";
  $("#pwcard").innerHTML=`
    <h2 style="margin:0 0 6px">Change Password</h2>
    <p class="mut" style="margin-bottom:12px">Palitan ang password para sa account: <b>${esc(user.name)}</b> (ID: <code>${esc(user.id)}</code>).</p>
    <form data-f="PW">
      <label>Current password</label>
      <input type="password" id="p_old" required autocomplete="current-password" placeholder="Kasalukuyang password">
      <label style="margin-top:10px">New password (min. 6 characters)</label>
      <input type="password" id="p_new" required autocomplete="new-password" placeholder="Bagong password">
      <label style="margin-top:10px">Confirm new password</label>
      <input type="password" id="p_new2" required autocomplete="new-password" placeholder="Ulitin ang bagong password">
      <div class="row" style="margin-top:16px">
        <button type="button" class="s" data-act="pwclose">Cancel</button>
        <button class="b">Save password</button>
      </div>
    </form>
  `;
  setTimeout(()=>{if($("#p_old"))$("#p_old").focus()},60);
}

async function doChangePw(e){
  e.preventDefault();
  if(!user) return;
  const o=$("#p_old").value, n=$("#p_new").value, n2=$("#p_new2").value;
  if(n.length<6){toast("New password must be at least 6 characters.");return}
  if(n!==n2){toast("Passwords do not match.");return}
  
  const oldHash=await hp(user.id,o);
  const defP=DEFAULT_DAT_PASSWORDS[user.id];
  const legP=LEGACY_DAT_PASSWORDS[user.id];
  const savedHash=AC[user.id];
  
  const isMatch=(savedHash&&savedHash===oldHash)||
                (!savedHash&&(o===defP||o===legP))||
                (o===defP||o===legP);
                
  if(!isMatch){
    toast("Current password is incorrect.");
    return;
  }
  
  AC[user.id]=await hp(user.id,n);
  saveAc();
  try{
    const remObj=JSON.parse(localStorage.getItem("dat_remembered_pw")||"{}");
    if(remObj[user.id]){
      remObj[user.id]=n;
      localStorage.setItem("dat_remembered_pw",JSON.stringify(remObj));
    }
  }catch(_){}
  
  $("#pwwrap").style.display="none";
  toast("Password updated successfully!");
}

function tryRestoreSession(){
  try{
    const s=sessionStorage.getItem("dat_user");
    if(s){
      const a=JSON.parse(s);
      if(a&&a.id&&ACC.some(x=>x.id===a.id)){
        user=a;
        role=a.role;
        ag=a.agency||AG[0];
        $("#login").style.display="none";
        updateWho();
        render();
        return;
      }
    }
  }catch(e){}
  showLogin();
}
async function setPw(id){const v=$("#pw_"+id).value;if(v.length<6){toast("Use at least 6 characters");return}AC[id]=await hp(id,v);saveAc();toast("Password set");render()}
function fillBy(s){s=s||"#view";document.querySelectorAll(s+' input[name="by"],'+s+' input[name="eby"]').forEach(i=>{if(!i.value)i.value=user.name})}
function adminOnly(){return true}
function okTyped(){const c=$("#rstc");if(!c||c.value.trim()!=="RESET"){toast("Type RESET to confirm");return false}return true}
function delSel(){if(!adminOnly()||!okTyped())return;const ids=[...document.querySelectorAll(".dsel:checked")].map(x=>x.value);if(!ids.length){toast("Select records first");return}D=D.filter(r=>!ids.includes(r.id));save();toast(ids.length+" record(s) deleted");render()}
function delAll(){if(!adminOnly()||!okTyped())return;D=[];save();toast("All records deleted");render()}
function rstPw(id){if(!adminOnly())return;delete AC[id];saveAc();toast("Password reset");render()}
function rstAllPw(){if(!adminOnly()||!okTyped())return;ACC.forEach(a=>{if(a.id!=="adminhead")delete AC[a.id]});saveAc();toast("Passwords reset");render()}
let dAg="";
function cnt(rs){const s=r=>status(r),n=f=>rs.filter(f).length;return{t:rs.length,p:n(r=>!r.rev),mi:n(r=>lvl(r)==="Minor"),ma:n(r=>lvl(r)==="Major"),cr:n(r=>lvl(r)==="Critical"),cl:n(r=>lvl(r)==="Commitment"),aw:n(r=>s(r)==="Showcause issued - awaiting explanation"),ov:n(r=>/overdue/.test(s(r))),cd:n(r=>!!r.fin)}}
function viewG(){const v=vis(),A=role==="agency"?[ag]:AG,tot=cnt(v),rows=A.map(a=>[a,cnt(v.filter(r=>r.agency===a))]),mx=Math.max(1,...rows.map(x=>x[1].t));
const sel=role==="agency"?ag:dAg,dc=DEPTS.map(d=>[d,cnt(v.filter(r=>(!sel||r.agency===sel)&&r.dept===d))]).filter(x=>x[1].t);
const k=(l,n,bad)=>`<div class="card" style="margin:0"><div class="mut">${l}</div><div style="font-size:26px;font-weight:600${bad&&n?";color:var(--bad)":""}">${n}</div></div>`;
const th="<tr><th>#</th><th>Notices</th><th>Pending review</th><th>Minor</th><th>Major</th><th>Critical</th><th>Commitment</th><th>Awaiting expl.</th><th>Overdue</th><th>Closed (DAR)</th></tr>";
const tr=(l,c,b)=>`<tr${b?' style="font-weight:600"':""}><td>${esc(l)}</td><td>${c.t}</td><td>${c.p}</td><td>${c.mi}</td><td>${c.ma}</td><td>${c.cr}</td><td>${c.cl}</td><td>${c.aw}</td><td${c.ov?' style="color:var(--bad)"':""}>${c.ov}</td><td>${c.cd}</td></tr>`;
return`<div class="grid" style="margin-bottom:12px">${k("Total notices",tot.t)}${k("Pending review",tot.p)}${k("Awaiting explanation",tot.aw)}${k("Overdue",tot.ov,1)}${k("Closed (DAR)",tot.cd)}</div>
<div class="card"><h2>Dashboard per agency</h2><div class="tw"><table>${th.replace("#","Agency")}${rows.map(x=>tr(x[0],x[1])).join("")}${role==="agency"?"":tr("Total",tot,1)}</table></div></div>
<div class="card"><h2>Notices per agency</h2>${rows.map(x=>`<div style="display:flex;align-items:center;gap:8px;margin:5px 0"><span style="width:200px">${esc(x[0])}</span><div style="flex:1;background:var(--bg);border-radius:4px"><div style="width:${x[1].t/mx*100}%;background:var(--ac);height:14px;border-radius:4px"></div></div><b>${x[1].t}</b></div>`).join("")}</div>
<div class="card"><h2>By department</h2><div class="grid" style="margin-bottom:8px"><div><label>Agency</label><select id="dag"${role==="agency"?" disabled":""}><option value="">All agencies</option>${AG.map(a=>`<option${a===sel?" selected":""}>${a}</option>`).join("")}</select></div></div><div class="tw"><table>${th.replace("#","Department")}${dc.map(x=>tr(x[0],x[1])).join("")||'<tr><td colspan="10" class="mut">No records.</td></tr>'}</table></div></div>`}
let DC={},DCL=[];try{const x=JSON.parse(localStorage.getItem("dat_dc")||"{}");DC=x.DC||{};DCL=x.DCL||[]}catch(e){}
const dcLine=k=>{const c=DC[k]||{};return`<p class="mut" style="margin:-4px 0 10px">Document Code: <b>${esc(c.code||"-")}</b> &middot; Rev. No.: <b>${esc(c.rev||"-")}</b> &middot; Effective Date: <b>${c.eff?fd(c.eff):"-"}</b></p>`};

function getRecordTimestamp(r) {
  if (!r) return 0;
  let ts = 0;
  if (r.at) { const t = new Date(r.at).getTime(); if (!isNaN(t) && t > ts) ts = t; }
  if (r.rev && r.rev.at) { const t = new Date(r.rev.at).getTime(); if (!isNaN(t) && t > ts) ts = t; }
  if (r.fin && r.fin.at) { const t = new Date(r.fin.at).getTime(); if (!isNaN(t) && t > ts) ts = t; }
  if (Array.isArray(r.log) && r.log.length > 0) {
    const last = r.log[r.log.length - 1];
    if (last && last.at) { const t = new Date(last.at).getTime(); if (!isNaN(t) && t > ts) ts = t; }
  }
  return ts;
}

window.applyDatData = function(cloudData) {
  if (!cloudData) return;
  if (Array.isArray(cloudData.records)) {
    cloudData.records.forEach(r => {
      if (MAP[r.agency]) r.agency = MAP[r.agency];
      if (r.dept === "PLI") r.dept = "Quality";
    });

    const localMap = new Map();
    D.forEach(r => {
      if (MAP[r.agency]) r.agency = MAP[r.agency];
      if (r.dept === "PLI") r.dept = "Quality";
      localMap.set(r.id, r);
    });

    const mergedList = [];
    const processedIds = new Set();

    cloudData.records.forEach(cloudR => {
      processedIds.add(cloudR.id);
      const localR = localMap.get(cloudR.id);
      if (!localR) {
        mergedList.push(cloudR);
      } else {
        const cloudTs = getRecordTimestamp(cloudR);
        const localTs = getRecordTimestamp(localR);
        if (cloudTs >= localTs) {
          const merged = Object.assign({}, localR, cloudR);
          if (!cloudR.rev && localR.rev) merged.rev = localR.rev;
          if (!cloudR.fin && localR.fin) merged.fin = localR.fin;
          if (!cloudR.rev?.file && localR.rev?.file) {
            if (merged.rev) merged.rev.file = localR.rev.file;
          }
          mergedList.push(merged);
        } else {
          const merged = Object.assign({}, cloudR, localR);
          mergedList.push(merged);
        }
      }
    });

    const cloudUpdatedTs = cloudData.lastUpdated ? new Date(cloudData.lastUpdated).getTime() : 0;
    localMap.forEach((localR, id) => {
      if (!processedIds.has(id)) {
        const localTs = getRecordTimestamp(localR);
        if (localTs > cloudUpdatedTs || (Date.now() - localTs < 120000)) {
          mergedList.push(localR);
        }
      }
    });

    D.length = 0;
    mergedList.forEach(r => D.push(r));
    mem = D;
    try { localStorage.setItem("dat1", JSON.stringify(D)); } catch(e) {}
  }

  if (cloudData.accounts && typeof cloudData.accounts === "object") {
    Object.assign(AC, cloudData.accounts);
    try { localStorage.setItem("dat_ac", JSON.stringify(AC)); } catch(e) {}
  }

  if (cloudData.docControl) {
    if (cloudData.docControl.DC) Object.assign(DC, cloudData.docControl.DC);
    if (Array.isArray(cloudData.docControl.DCL)) {
      const existingTimestamps = new Set(DCL.map(x => x.at));
      cloudData.docControl.DCL.forEach(x => {
        if (!existingTimestamps.has(x.at)) DCL.push(x);
      });
    }
    try { localStorage.setItem("dat_dc", JSON.stringify({DC, DCL})); } catch(e) {}
  }

  if (user && typeof render === "function") render();
};

let PENDING_FILES={};
function handleFileSelect(inp, id){
  const f=inp.files&&inp.files[0];
  if(!f)return;
  if(f.size>5*1024*1024){toast("Masyadong malaki ang file (maximum 5MB).");inp.value="";return}
  const reader=new FileReader();
  reader.onload=function(e){
    if(f.type&&f.type.startsWith("image/")){
      const img=new Image();
      img.onload=function(){
        const canvas=document.createElement("canvas");
        let w=img.width, h=img.height;
        const max=1200;
        if(w>max||h>max){
          if(w>h){ h=Math.round((h*max)/w); w=max; }
          else { w=Math.round((w*max)/h); h=max; }
        }
        canvas.width=w; canvas.height=h;
        const ctx=canvas.getContext("2d");
        ctx.drawImage(img,0,0,w,h);
        const dataUrl=canvas.toDataURL("image/jpeg",0.82);
        PENDING_FILES[id]={
          name:f.name.replace(/\.[^.]+$/,".jpg"),
          size:Math.round(dataUrl.length*0.75),
          type:"image/jpeg",
          data:dataUrl,
          uploadedAt:new Date().toISOString()
        };
        const prev=$("#file_preview_"+id);
        if(prev) prev.innerHTML=`<span class="tag ok" style="margin-top:4px;display:inline-block">✓ ${esc(f.name)} (${Math.round(dataUrl.length*0.75/1024)} KB) naka-attach</span>`;
        toast("Photo attached & optimized: "+f.name);
      };
      img.src=e.target.result;
    } else {
      PENDING_FILES[id]={
        name:f.name,
        size:f.size,
        type:f.type||"application/octet-stream",
        data:e.target.result,
        uploadedAt:new Date().toISOString()
      };
      const prev=$("#file_preview_"+id);
      if(prev) prev.innerHTML=`<span class="tag ok" style="margin-top:4px;display:inline-block">✓ ${esc(f.name)} (${Math.round(f.size/1024)} KB) naka-attach</span>`;
      toast("File attached: "+f.name);
    }
  };
  reader.readAsDataURL(f);
}

function viewAttachedFile(id){
  const r=D.find(x=>x.id===id);
  const file=r&&r.rev&&r.rev.file;
  if(!file||!file.data){toast("Walang naka-attach na file.");return}
  const w=window.open("");
  if(file.type&&file.type.startsWith("image/")){
    w.document.write(`<title>${esc(file.name)}</title><body style="margin:0;background:#111;display:flex;justify-content:center;align-items:center;min-height:100vh"><img src="${file.data}" style="max-width:100%;max-height:100vh;box-shadow:0 0 20px rgba(0,0,0,0.5)"></body>`);
  } else if(file.type==="application/pdf"){
    w.document.write(`<title>${esc(file.name)}</title><iframe src="${file.data}" style="position:fixed;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`);
  } else {
    const a=document.createElement("a");
    a.href=file.data;
    a.download=file.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if(w)w.close();
  }
}

function manualSyncRefresh(){
  toast("Syncing with cloud...");
  if(window.MhcCloudSync && typeof window.MhcCloudSync.pull === "function"){
    window.MhcCloudSync.pull().then(() => {
      render();
      toast("Records refreshed from cloud! ✓");
    }).catch(() => {
      toast("Sync completed.");
    });
  } else {
    render();
  }
}

function render(){

function exportCSV(){const n={A:12,B:18,C:21,D:21}[tab];let rows=vis();if(tab==="B")rows=rows.filter(r=>r.rev);if(tab==="C")rows=rows.filter(isMC);
const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
const ks={A:["noa"],B:["tracker","sc","dar","cl"],C:["tracker","dar"],D:["tracker","noa"]}[tab],meta=[["Document","Document Code","Revision No.","Effective Date"]].concat(ks.map(k=>{const c=DC[k]||{};return[DOCS.find(d=>d[0]===k)[1],c.code||"",c.rev||"",c.eff||""]})).concat([[]]);
const ds=rows.map(r=>r.doi).filter(Boolean).sort(),cov=ds.length?(ds[0]===ds[ds.length-1]?ymd(ds[0]):ymd(ds[0])+"-"+ymd(ds[ds.length-1])):ymd(new Date().toISOString().slice(0,10));
saveFile(fname(DC[ks[0]]||{},ks[0]==="noa"?"Notice of Attention":"Disciplinary Action Tracker - "+{B:"Agency Review",C:"Major and Critical Review",D:"Status"}[tab],cov,".csv"),"\ufeff"+meta.concat([COLS.slice(0,n).concat(COLS.slice(21))],rows.map(r=>rowOf(r).slice(0,n).concat(rowOf(r).slice(21)))).map(a=>a.map(q).join(",")).join("\n"))}

const edBtns=(r,k)=>`<button class="s" data-act="edit" data-k="${k}" data-id="${r.id}">Edit</button>`+(r.log&&r.log.length?` <button class="s" data-act="edit" data-k="H" data-id="${r.id}">History (${r.log.length})</button>`:"");
const selO=(l,v)=>l.map(x=>`<option${x===v?" selected":""}>${esc(x)}</option>`).join("");
function diff(a,b,lab){return Object.keys(lab).filter(k=>String(a[k]||"")!==String(b[k]||"")).map(k=>({f:lab[k],a:a[k]||"",b:b[k]||""}))}
function saveEdit(k,o,r,now){let ch,sec;
if(k==="EB"){const v=r.rev,mc=o.cat==="Major"||o.cat==="Critical",n={cat:o.cat,offense:o.offense.trim(),days:mc?o.days:v.days,nth:o.cat==="Minor"?o.nth:"",act:o.cat==="Minor"?o.act:"",rep:o.cat==="Minor"?o.rep:""};
if(PENDING_FILES[r.id]){v.file=PENDING_FILES[r.id];delete PENDING_FILES[r.id];}
ch=diff(v,n,{cat:"Classification",offense:"Offense",days:"Explanation days",nth:"Offense no.",act:"Action/Recommendation",rep:"When Repeated"});if(ch.length)Object.assign(v,n);sec="Agency review (B)"}
else{const v=r.fin,n={viol:o.viol.trim(),expl:o.expl.trim(),edate:o.edate,nth:o.nth,rec:o.rec,rep:o.rep,recd:o.recd.trim()};
ch=diff(v,n,{viol:"Violation",expl:"Explanation",edate:"Explanation date",nth:"Offense no.",rec:"Action/Recommendation",rep:"When Repeated",recd:"Remarks"});if(ch.length)Object.assign(v,n);sec="Major/Critical review (C)"}
if(!ch.length&&!v.file){toast("No changes made");return}
(r.log=r.log||[]).push({at:now,acct:user.name,by:o.eby.trim(),sec,ch,why:o.why.trim()});save();$("#edwrap").style.display="none";toast("Changes saved and logged");render()}
function openEdit(id,k){const r=D.find(x=>x.id===id);let h="";

else if(k==="B"){const v=r.rev,m=v.cat==="Minor"?"":"display:none";h=`<h2>Edit review - ${esc(r.ref)} ${esc(nm(r))}</h2><form data-f="EB" data-id="${id}"><div class="grid"><div><label>Classification</label><select name="cat">${selO(["Minor","Major","Critical","Commitment"],v.cat)}</select></div><div><label>Offense / violation</label><input name="offense" required value="${esc(v.offense)}"></div><div><label>Explanation within (Major/Critical)</label><select name="days"><option value="1"${v.days==="1"?" selected":""}>1 day</option><option value="3"${v.days==="3"?" selected":""}>3 days</option><option value="5"${v.days==="5"?" selected":""}>5 days</option></select></div><div class="mn" style="${m}"><label>Offense no. (Minor)</label><select name="nth">${selO(NTH,v.nth||"1st")}</select></div><div class="mn full" style="${m}"><label>Action / Recommendation (Minor)</label><select name="act">${selO(MIN,v.act||MIN[0])}</select></div><div class="mn full" style="${m}"><label>When Repeated - Action / Recommendation (Minor)</label><select name="rep"><option value="">-</option>${selO(MIN,v.rep||"")}</select></div>${v.file?`<div class="full" style="padding:6px;background:var(--bg);border-radius:6px;margin:4px 0">Naka-attach na sulat: <b>${esc(v.file.name)}</b> <button type="button" class="s" onclick="viewAttachedFile('${id}')" style="margin-left:6px">Tingnan</button></div>`:""}<div class="full"><label>Palitan / Mag-upload ng Disciplinary Action Letter (PDF / Larawan / Scan)</label><input type="file" accept=".pdf,image/*,.doc,.docx" onchange="handleFileSelect(this, '${id}')"><div id="file_preview_${id}"></div></div></div>`+foot}
else{const v=r.fin;h=`<h2>Edit Major/Critical review - ${esc(r.ref)} ${esc(nm(r))}</h2><form data-f="EC" data-id="${id}"><div class="grid"><div class="full"><label>Violation</label><input name="viol" required value="${esc(v.viol)}"></div><div class="full"><label>Employee explanation</label><textarea name="expl" required>${esc(v.expl)}</textarea></div><div><label>Date explanation received</label><input type="date" name="edate" value="${esc(v.edate)}"></div><div><label>Offense no.</label><select name="nth">${selO(NTH.slice(0,3),v.nth)}</select></div><div class="full"><label>Action / Recommendation</label><select name="rec">${selO(MAJ,v.rec)}</select></div><div class="full"><label>When Repeated - Action / Recommendation</label><select name="rep"><option value="">-</option>${selO(MAJ,v.rep||"")}</select></div><div class="full"><label>Remarks</label><input name="recd" value="${esc(v.recd)}"></div></div>`+foot}
$("#ed").innerHTML=h;fillBy("#ed");$("#edwrap").style.display="block"}

else{const f=r.fin,minor=!f;h=head("<b>Ulat ng aksyong pandisiplina (DAR)</b>",minor?"Magaan na paglabag":"Pinal na abiso ng pasya (ikalawang abiso)")+who+`<tr><th>Nagawang paglabag</th><td>${esc(minor?r.rev.offense:f.viol)} (${CF[r.rev.cat]})</td></tr><tr><th>Detalye ng insidente</th><td class="pre">${esc(r.concern)}</td></tr>`+(minor?"":`<tr><th>Paliwanag ng empleyado</th><td class="pre">${esc(f.expl)}${f.edate?"<br>Natanggap: "+fd(f.edate):""}</td></tr>`)+`<tr><th>Karampatang aksyon</th><td>${minor?"Bilang ng paglabag: "+esc(tr(r.rev.nth))+"<br>Aksyon: "+esc(tr(r.rev.act)):"Bilang ng paglabag: "+esc(tr(f.nth))+"<br>Aksyon: "+esc(tr(f.rec))+(f.recd?"<br>Mga puna: "+esc(f.recd):"")}</td></tr><tr><th>Kung mauulit ang nagawang paglabag, ito ay mag-resulta sa</th><td>${esc(tr(minor?r.rev.rep:f.rep))||"&nbsp;"}</td></tr><tr><th>Sinuri ni / petsa</th><td>${esc(r.rev.by)}, ${fmt(r.rev.at)}</td></tr></table><p>Petsa ng pagpapalabas: ${now}. Reference: ${esc(r.ref)}</p>${sg([["Sumasang-ayon","Pangalan at lagda ng empleyado"],["Saksi","Pangalan at lagda"],["Inihanda ni","Pangalan at lagda"],["Pinagtibay ni","Agency authorized signatory"]],1)}`}
